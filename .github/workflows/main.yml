name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun audit --audit-level=critical
      # `build` is check + bundle, so this typechecks, lints and svelte-checks
      # before bundling. main.js is not tracked, so there is nothing to diff it
      # against: release.yml builds the bundle it publishes, at the tag.
      - run: bun run build
      - run: bun test
